# Directories created in $HOME
macos_directories:
  - Development
  - Pictures/Screenshots
  - Pictures/Wallpapers

# `defaults write` settings. `restart` = app to restart when the value changes.
# Trackpad/mouse/Spaces settings take effect after logging out and back in.
macos_defaults:
  # --- Trackpad ---
  - { domain: com.apple.AppleMultitouchTrackpad, key: Clicking, type: bool, value: true }
  - { domain: com.apple.driver.AppleBluetoothMultitouch.trackpad, key: Clicking, type: bool, value: true }
  - { domain: NSGlobalDomain, key: com.apple.mouse.tapBehavior, type: int, value: 1 }
  - { domain: NSGlobalDomain, key: com.apple.mouse.tapBehavior, type: int, value: 1, host: currentHost }
  - { domain: com.apple.AppleMultitouchTrackpad, key: TrackpadRightClick, type: bool, value: true }
  - { domain: com.apple.driver.AppleBluetoothMultitouch.trackpad, key: TrackpadRightClick, type: bool, value: true }
  - { domain: NSGlobalDomain, key: com.apple.trackpad.scaling, type: float, value: 3.0 }

  # --- Mouse (Magic Mouse) ---
  - { domain: NSGlobalDomain, key: com.apple.mouse.scaling, type: float, value: 3.0 }
  - { domain: NSGlobalDomain, key: com.apple.swipescrolldirection, type: bool, value: true }
  - { domain: com.apple.driver.AppleBluetoothMultitouch.mouse, key: MouseButtonMode, type: string, value: TwoButton }
  - { domain: com.apple.AppleMultitouchMouse, key: MouseButtonMode, type: string, value: TwoButton }
  - { domain: com.apple.driver.AppleBluetoothMultitouch.mouse, key: MouseOneFingerDoubleTapGesture, type: int, value: 0 }
  - { domain: com.apple.AppleMultitouchMouse, key: MouseOneFingerDoubleTapGesture, type: int, value: 0 }

  # --- Dock & Spaces ---
  - { domain: com.apple.dock, key: autohide, type: bool, value: true, restart: Dock }
  - { domain: com.apple.dock, key: show-recents, type: bool, value: false, restart: Dock }
  - { domain: com.apple.dock, key: magnification, type: bool, value: true, restart: Dock }
  - { domain: com.apple.dock, key: tilesize, type: float, value: 42.0, restart: Dock }
  - { domain: com.apple.dock, key: largesize, type: float, value: 52.0, restart: Dock }
  - { domain: com.apple.spaces, key: spans-displays, type: bool, value: true }  # "Displays have separate Spaces": off

  # --- Desktop & windows ---
  - { domain: com.apple.WindowManager, key: EnableStandardClickToShowDesktop, type: bool, value: false }
  - { domain: com.apple.WindowManager, key: EnableTiledWindowMargins, type: bool, value: true }

  # --- Finder ---
  - { domain: com.apple.finder, key: AppleShowAllFiles, type: bool, value: true, restart: Finder }
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: clmv, restart: Finder }
  - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: ShowStatusBar, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: _FXEnableColumnAutoSizing, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: ShowHardDrivesOnDesktop, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: ShowExternalHardDrivesOnDesktop, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: ShowRemovableMediaOnDesktop, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: ShowMountedServersOnDesktop, type: bool, value: true, restart: Finder }
  - { domain: com.apple.finder, key: NewWindowTarget, type: string, value: PfHm, restart: Finder }
  - { domain: com.apple.finder, key: ShowRecentTags, type: bool, value: false, restart: Finder }
  - { domain: com.apple.finder, key: FXRemoveOldTrashItems, type: bool, value: true, restart: Finder }

  # --- Screenshots ---
  - { domain: com.apple.screencapture, key: location, type: string, value: "{{ home_dir }}/Pictures/Screenshots", restart: SystemUIServer }

  # --- Menu bar (values copied from Compooter; undocumented codes, 8 = hidden) ---
  - { domain: com.apple.Siri, key: StatusMenuVisible, type: bool, value: false, restart: SystemUIServer }
  - { domain: com.apple.controlcenter, key: AirDrop, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Bluetooth, type: int, value: 2, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: FocusModes, type: int, value: 2, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: NowPlaying, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Siri, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Sound, type: int, value: 16, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Spotlight, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Timer, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: Weather, type: int, value: 8, host: currentHost, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: "NSStatusItem VisibleCC Battery", type: bool, value: true, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: "NSStatusItem VisibleCC BentoBox-0", type: bool, value: true, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: "NSStatusItem VisibleCC Clock", type: bool, value: true, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: "NSStatusItem VisibleCC Sound", type: bool, value: true, restart: ControlCenter }
  - { domain: com.apple.controlcenter, key: "NSStatusItem VisibleCC WiFi", type: bool, value: true, restart: ControlCenter }
